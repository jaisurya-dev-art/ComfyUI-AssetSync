[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-sync"
version = "0.2.0"
description = "Send generated 3D assets from ComfyUI to Blender, Maya, and Unreal Engine"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Jaisurya"}]
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/jaisurya-dev-art/ComfyUI-AssetSync"
Documentation = "https://github.com/jaisurya-dev-art/ComfyUI-AssetSync#readme"
"Bug Tracker" = "https://github.com/jaisurya-dev-art/ComfyUI-AssetSync/issues"

[tool.comfy]
PublisherId = "jaisurya-c"
DisplayName = "ComfyUI AssetSync"

[tool.setuptools.packages.find]
include = ["assetsync*"]
